[package]
name = "img2c"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
eframe = { version = "0.29", features = ["default_fonts", "glow"] }
egui = "0.29"
image = { version = "0.25", features = ["png", "jpeg", "bmp", "gif", "tiff", "webp"] }
rfd = "0.15"
anyhow = "1.0"
tempfile = "3.10"
walkdir = "2.5"
regex = "1"
